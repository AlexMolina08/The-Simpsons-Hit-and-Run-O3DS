name: Host checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Release integrity and version handling
        run: python3 tools/3ds/tests/release_workflow.py
      - name: Retail HOME Menu archive bounds
        run: python3 tools/3ds/tests/home_menu.py
      - name: Linux packaging tools
        run: python3 -c 'from pathlib import Path; import sys; sys.path.insert(0,"tools/3ds"); from release_tools import locate; print(locate(Path.cwd()))'
      - name: Lid wake events and audio lifecycle
        run: |
          mkdir -p out/lid-test
          c++ -std=c++11 -fsanitize=address,undefined -Ilibs/radsound/src/hal/ctr tools/3ds/tests/lid_audio.cpp -o out/lid-test/check
          cd out/lid-test
          ./check
      - name: SD setup routing
        run: python3 tools/3ds/tests/movie_setup.py
      - name: Bundled reads and writable saves
        run: python3 tools/3ds/tests/bundled_assets.py
      - name: Title navigation and camera settings
        run: python3 tools/3ds/tests/gui_input.py
      - name: Newspaper entrance and asynchronous font readiness
        run: python3 tools/3ds/tests/loading_animation.py
      - name: Credits rendering and vertex exhaustion
        run: python3 tools/3ds/tests/credits_rendering.py
      - name: Handheld tutorial text layout
        run: python3 tools/3ds/tests/handheld_text.py
      - name: Browser builder selection and language state
        run: |
          node browser-builder/tests/app-state-unit.mjs
          node browser-builder/tests/conversion-unit.mjs
          node browser-builder/tests/languages-unit.mjs
          node browser-builder/tests/source-input.mjs
          node browser-builder/tests/zip-iso-unit.mjs
      - name: HOME Menu artwork
        run: |
          python3 -m pip install Pillow==10.2.0
          python3 tools/3ds/tests/home_artwork.py
      - name: Character form preparation and depth haze
        run: |
          python3 tools/3ds/tests/character_form.py
          python3 tools/3ds/tests/distance_haze.py
